# Render Blueprint: one web service and one Postgres database.
databases:
  - name: sakshya-db
    plan: basic-256mb
    diskSizeGB: 5  # can be increased later, never decreased
    region: singapore
    databaseName: sakshya
    user: sakshya

services:
  - type: web
    name: sakshya
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app wsgi init-db
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sakshya-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "1"
      - key: ALLOW_SIGNUP
        value: "0"  # prospects use the demo logins; set to "1" to open self-serve trials
      - key: DEMO_PASSWORD
        value: sakshya-demo
      - key: APP_TZ
        value: Asia/Kolkata
      - key: PAYMENT_URL
        value: https://razorpay.me/@saumyajitghosh8959
      - key: ANTHROPIC_API_KEY
        sync: false
